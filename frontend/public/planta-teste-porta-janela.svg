<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" style="background:#fff">
  <!-- Título -->
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" font-family="Arial">PLANTA BAIXA RESIDENCIAL - COM PORTA E JANELA</text>
  
  <!-- COZINHA -->
  <rect x="100" y="80" width="270" height="270" fill="none" stroke="#000" stroke-width="2"/>
  <text x="235" y="200" text-anchor="middle" font-size="14" font-weight="bold">COZINHA</text>
  <text x="235" y="220" text-anchor="middle" font-size="11">300h</text>
  <text x="235" y="235" text-anchor="middle" font-size="11">459m²</text>
  
  <!-- Medidas COZINHA -->
  <text x="235" y="70" text-anchor="middle" font-size="10">270</text>
  <text x="85" y="215" text-anchor="middle" font-size="10" transform="rotate(-90 85 215)">270</text>
  <text x="180" y="360" text-anchor="middle" font-size="10">170</text>
  
  <!-- QUARTO -->
  <rect x="370" y="80" width="240" height="170" fill="none" stroke="#000" stroke-width="2"/>
  <text x="490" y="160" text-anchor="middle" font-size="14" font-weight="bold">QUARTO</text>
  <text x="490" y="180" text-anchor="middle" font-size="11">230h</text>
  <text x="490" y="195" text-anchor="middle" font-size="11">312m²</text>
  
  <!-- Medidas QUARTO -->
  <text x="490" y="70" text-anchor="middle" font-size="10">240</text>
  <text x="620" y="165" text-anchor="middle" font-size="10">130</text>
  
  <!-- BANHEIRO -->
  <rect x="370" y="250" width="240" height="120" fill="none" stroke="#000" stroke-width="2"/>
  <text x="490" y="305" text-anchor="middle" font-size="14" font-weight="bold">BANHEIRO</text>
  <text x="490" y="325" text-anchor="middle" font-size="11">220h</text>
  <text x="490" y="340" text-anchor="middle" font-size="11">288m²</text>
  
  <!-- Medidas BANHEIRO -->
  <text x="490" y="380" text-anchor="middle" font-size="10">240</text>
  <text x="620" y="310" text-anchor="middle" font-size="10">120</text>
  
  <!-- Viga v1 -->
  <rect x="455" y="80" width="40" height="40" fill="#8B0000" stroke="#000" stroke-width="1"/>
  <text x="475" y="65" text-anchor="middle" font-size="9" fill="#8B0000">v1</text>
  
  <!-- Paredes identificadas -->
  <text x="100" y="215" text-anchor="end" font-size="10" fill="#333">p1</text>
  <text x="235" y="75" text-anchor="middle" font-size="10" fill="#333">p2</text>
  <text x="420" y="75" text-anchor="middle" font-size="10" fill="#333">p3.1</text>
  <text x="530" y="75" text-anchor="middle" font-size="10" fill="#333">p3.2</text>
  <text x="615" y="165" text-anchor="start" font-size="10" fill="#333">p4</text>
  <text x="615" y="310" text-anchor="start" font-size="10" fill="#333">p5</text>
  <text x="490" y="375" text-anchor="middle" font-size="10" fill="#333">p6</text>
  <text x="180" y="355" text-anchor="middle" font-size="10" fill="#333">p7</text>
  <text x="365" y="200" text-anchor="end" font-size="10" fill="#333">p8</text>
  <text x="365" y="310" text-anchor="end" font-size="10" fill="#333">p9</text>
  <text x="490" y="255" text-anchor="middle" font-size="10" fill="#333">p10</text>
  
  <!-- LP markers -->
  <text x="95" y="95" font-size="9" fill="#c00" font-weight="bold">LP</text>
  <text x="95" y="345" font-size="9" fill="#c00" font-weight="bold">LP</text>
  <text x="600" y="95" font-size="9" fill="#c00" font-weight="bold">LP</text>
  <text x="600" y="365" font-size="9" fill="#c00" font-weight="bold">LP</text>
  
  <!-- ========== PORTA na parede p1 (COZINHA) ========== -->
  <rect x="100" y="180" width="8" height="100" fill="#fff" stroke="#000" stroke-width="1"/>
  <line x1="108" y1="180" x2="108" y2="280" stroke="#8B4513" stroke-width="3"/>
  <!-- Arco da porta -->
  <path d="M 108 180 Q 160 180 160 230" fill="none" stroke="#8B4513" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="108" y1="180" x2="160" y2="230" stroke="#8B4513" stroke-width="1"/>
  <!-- Medidas da porta -->
  <rect x="115" y="215" width="60" height="30" fill="#FFF8DC" stroke="#8B4513" stroke-width="1" rx="3"/>
  <text x="145" y="228" text-anchor="middle" font-size="8" font-weight="bold" fill="#8B4513">PORTA</text>
  <text x="145" y="240" text-anchor="middle" font-size="7" fill="#8B4513">100 × 210 cm</text>
  <!-- Cota posição -->
  <line x1="100" y1="170" x2="100" y2="180" stroke="#c00" stroke-width="1"/>
  <line x1="100" y1="175" x2="100" y2="175" stroke="#c00" stroke-width="1"/>
  <text x="104" y="172" font-size="7" fill="#c00">posX: 50cm</text>
  
  <!-- ========== JANELA na parede p4 (QUARTO) ========== -->
  <rect x="610" y="140" width="8" height="80" fill="#87CEEB" stroke="#1E90FF" stroke-width="2"/>
  <!-- Linhas da janela -->
  <line x1="610" y1="180" x2="618" y2="180" stroke="#1E90FF" stroke-width="1"/>
  <line x1="614" y1="140" x2="614" y2="220" stroke="#1E90FF" stroke-width="1"/>
  <!-- Medidas da janela -->
  <rect x="625" y="155" width="70" height="50" fill="#E0F7FA" stroke="#1E90FF" stroke-width="1" rx="3"/>
  <text x="660" y="170" text-anchor="middle" font-size="8" font-weight="bold" fill="#1E90FF">JANELA</text>
  <text x="660" y="182" text-anchor="middle" font-size="7" fill="#1E90FF">100 × 100 cm</text>
  <text x="660" y="193" text-anchor="middle" font-size="7" fill="#1E90FF">posX: 15cm</text>
  <text x="660" y="202" text-anchor="middle" font-size="7" fill="#1E90FF">alt.solo: 100cm</text>
  
  <!-- Legenda -->
  <rect x="100" y="420" width="600" height="130" fill="#f9f9f9" stroke="#ccc" stroke-width="1" rx="5"/>
  <text x="400" y="445" text-anchor="middle" font-size="12" font-weight="bold">DADOS PARA TESTE - PORTAS E JANELAS</text>
  
  <!-- Dados da Porta -->
  <rect x="120" y="460" width="250" height="80" fill="#FFF8DC" stroke="#8B4513" stroke-width="1" rx="3"/>
  <text x="245" y="478" text-anchor="middle" font-size="10" font-weight="bold" fill="#8B4513">PORTA (parede p1 - COZINHA)</text>
  <text x="130" y="495" font-size="9" fill="#333">• altura: 2.1 m (210 cm)</text>
  <text x="130" y="508" font-size="9" fill="#333">• comprimento: 1.0 m (100 cm)</text>
  <text x="130" y="521" font-size="9" fill="#333">• posicaoX: 0.5 m (50 cm do início)</text>
  <text x="130" y="534" font-size="9" fill="#333">• posicaoY: 0 m (do topo da parede)</text>
  
  <!-- Dados da Janela -->
  <rect x="430" y="460" width="250" height="80" fill="#E0F7FA" stroke="#1E90FF" stroke-width="1" rx="3"/>
  <text x="555" y="478" text-anchor="middle" font-size="10" font-weight="bold" fill="#1E90FF">JANELA (parede p4 - QUARTO)</text>
  <text x="440" y="495" font-size="9" fill="#333">• altura: 1.0 m (100 cm)</text>
  <text x="440" y="508" font-size="9" fill="#333">• comprimento: 1.0 m (100 cm)</text>
  <text x="440" y="521" font-size="9" fill="#333">• posicaoX: 0.15 m (15 cm do início)</text>
  <text x="440" y="534" font-size="9" fill="#333">• posicaoSolo: 1.0 m (100 cm do chão)</text>
</svg>

